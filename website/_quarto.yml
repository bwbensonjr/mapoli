project:
  type: website
  output-dir: ../docs
  render:
    - index.qmd
    - about.qmd
    - districts/state-rep/*.qmd
    - districts/state-senate/*.qmd
    - districts/gov-council/*.qmd
    - districts/us-house/*.qmd

website:
  title: "mapoli"
  site-url: https://mapoli.us
  twitter-card: true
  open-graph: true
  google-analytics: "G-D7H3929JG1"
  page-footer:
    center: |
      See the [About](/about.html) page for data source information.
  navbar:
    left:
      - href: districts/state-rep/
        text: "State Representative"
      - href: districts/state-senate/
        text: "State Senate"
      - href: districts/gov-council/
        text: "Governor's Council"
      - href: districts/us-house/
        text: "U.S. House"
    right:
      - href: https://github.com/bwbensonjr/mapoli
        icon: github
        target: _blank

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

execute:
  freeze: auto
